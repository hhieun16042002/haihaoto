services:
  haiha-wordpress:
    image: wordpress:php8.4-apache
    container_name: haiha-wordpress
    restart: unless-stopped
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: haiha-db:3306
      WORDPRESS_DB_USER: haiha_user
      WORDPRESS_DB_PASSWORD: haiha_password
      WORDPRESS_DB_NAME: garaxe_db
    volumes:
      - ./wordpress:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - haiha-db

  haiha-db:
    image: mariadb:11.8
    container_name: haiha-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: garaxe_db
      MYSQL_USER: haiha_user
      MYSQL_PASSWORD: haiha_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - haiha_db_data:/var/lib/mysql
      - ./garaxe_db_clean.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"

volumes:
  haiha_db_data:

