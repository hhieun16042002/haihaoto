<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" role="img">
  <title>Mercedes-Benz</title>
  <defs>
    <linearGradient id="mbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003876"/>
      <stop offset="100%" stop-color="#001A3D"/>
    </linearGradient>
    <linearGradient id="mbChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Outer Chrome & Mercedes Royal Blue Laurel Ring -->
  <circle cx="70" cy="70" r="64" fill="url(#mbBlue)" stroke="url(#mbChrome)" stroke-width="4.5"/>
  <circle cx="70" cy="70" r="47" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Gold/Silver Laurel Accents on Blue Ring -->
  <path d="M24 70 A46 46 0 0 1 42 29" fill="none" stroke="#F5A300" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M116 70 A46 46 0 0 0 98 29" fill="none" stroke="#F5A300" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>
  <text x="70" y="21" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="8.2" letter-spacing="1.4">MERCEDES</text>
  <text x="70" y="126" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="8.5" letter-spacing="2.2">BENZ</text>
  <!-- 3D Beveled 3-Pointed Star -->
  <polygon points="70,24 64,65 70,70" fill="#94a3b8"/>
  <polygon points="70,24 76,65 70,70" fill="#00285A"/>
  <polygon points="30,93 64,65 70,70" fill="#00285A"/>
  <polygon points="30,93 70,77 70,70" fill="#94a3b8"/>
  <polygon points="110,93 76,65 70,70" fill="#94a3b8"/>
  <polygon points="110,93 70,77 70,70" fill="#001A3D"/>
</svg>
