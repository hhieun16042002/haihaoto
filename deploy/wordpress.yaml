# Website WordPress
apiVersion: v1
kind: Service
metadata:
  name: haiha-wordpress
spec:
  selector:
    app: haiha-wordpress
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haiha-wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haiha-wordpress
  template:
    metadata:
      labels:
        app: haiha-wordpress
    spec:
      containers:
        - name: wordpress
          # Đổi tag (v1 -> v2 ...) mỗi lần build lại image, rồi push Git
          image: haihaoto:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: haiha-db:3306
            - name: WORDPRESS_DB_NAME
              value: garaxe_db
            - name: WORDPRESS_DB_USER
              valueFrom: { secretKeyRef: { name: haihaoto-db, key: user } }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: haihaoto-db, key: password } }
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
